# docker compose up --build
#
# Prerequisite on the host (models are NOT in git):
#   python -m src.build_dataset && python -m src.baselines
#   python -m src.calibrate --model verdict_lr_plus
services:
  scamlens:
    build: .
    image: scamlens:0.5
    ports:
      - "8000:8000"
    environment:
      # Keeps the demo honest: this is a research prototype, not a product.
      SCAMLENS_ENV: "research-prototype"
    # The service is stateless and stores no messages, so no volumes are mounted.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
