# Words that appear in BOTH scams and ordinary messages. Alone they only
# justify a "suspicious" verdict.
weak_risk_keywords:
  - "click"
  - "link"
  - "http"
  - "www."
  - "verify"
  - "update"
  - "confirm"
  - "urgent"
  - "turant"
  - "immediately"
  - "last date"
  - "within 24 hours"
  - "aaj hi"
  - "abhi"
  - "reward"
  - "offer"
  - "credit"
  - "debit"
  - "transaction"
  - "upi"
  - "gpay"
  - "phonepe"
  - "paytm"
  - "bhejo"
  - "pay karein"
  - "call now"
  - "call kar"
  - "whatsapp"
  - "winner"
  - "congratulations"
  - "kyc"
  - "otp"
  - "bank"

# Real-message phrases that overrule weak risk words (hard-negative shield).
# These come from genuine bank/courier/OTP wording.
safe_veto_phrases:
  - "do not share this otp"
  - "never share your otp"
  - "do not share otp"
  - "has been credited"
  - "has been debited"
  - "is credited to"
  - "available balance"
  - "account balance is"
  - "your statement"
  - "txn amount"
  - "thank you for using"
  - "thanks for using"
  - "registered mobile number"
  - "will never ask for otp"
  - "do not click any link"
  - "track your parcel"
  - "out for delivery"
  - "delivered to"
  - "appointment on"
  - "your order has been shipped"

