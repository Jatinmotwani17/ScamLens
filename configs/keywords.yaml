# ============================================================
# ScamLens - hand-written keyword lists (src/baselines.py)
#
# This file powers the KEYWORD-RULE baseline: the deliberately simple
# baseline that a real classifier must beat. Everything here is written by
# hand in plain English + roman Hinglish. Matching is case-insensitive and
# SUBSTRING based, so "otp" also matches "OTP", "Otp", "your otp is".
#
# VERDICT LOGIC (simple on purpose):
#   1. if text contains any strong_scam_keyword     -> scam
#   2. else if text contains any safe_veto_phrase   -> safe   (legit patterns win)
#   3. else if text contains any weak_risk_keyword  -> suspicious
#   4. else                                         -> safe
#
# The safe_veto phrases exist to stop the classic false positive:
# "Your OTP is 483920. Do not share this OTP with anyone." is a REAL
# OTP message, not a scam asking for the OTP.
# ============================================================

# Words/phrases that basically only appear in scams. One hit = scam.
