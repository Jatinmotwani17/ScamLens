# ============================================================
# ScamLens Phase 3 - transformer training config
# Every run copies this file (plus CLI overrides) next to its results.
# ============================================================

# Default model. E1/E2 use MuRIL; E3 passes XLM-R on the command line.
model_name: "google/muril-base-cased"

max_length: 128          # hard cap per message; collate pads to batch max
batch_size: 16
eval_batch_size: 32
# Phase 3.5: pretrained encoder and randomly initialised heads need very
# different learning rates. The encoder moves slowly; the new heads move fast.
lr_encoder: 0.00003      # 3e-5 for the pretrained transformer
lr_heads: 0.001          # 1e-3 for the verdict + tag heads
epochs: 4
weight_decay: 0.01
warmup_ratio: 0.10
lambda_tags: 0.5         # weight of the tag BCE loss; 0 = verdict-only ablation
patience: 2              # early stopping on VAL verdict macro-F1
seed: 42
fp16: true               # only used when CUDA is available
grad_clip: 1.0
num_workers: 0           # Windows-friendly; raise on Linux if you like

# Phase 3.5 training mix. Every run saves this and reports it.
#   mix_synth_plus_real (E1 main) or mix_synth_only (E1s ablation)
train_mix: "mix_synth_plus_real"

# Class-imbalance handling
max_class_weight: 10.0   # cap for verdict class weights AND tag pos_weight

output_dir: "outputs"
checkpoint_name: "best_model.pt"
